name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  AWS_ENDPOINT_URL: ${{ secrets.LOCALSTACK_ENDPOINT }}
  
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '000000000000' }}
  ECR_REPOSITORY: feed-service
  K8S_DEPLOYMENT: feed-service
  K8S_CONTAINER: feed-service
jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Set LocalStack ECR Registry
        id: ecr
        run: |
          # Skip 'docker login' entirely. LocalStack accepts unauthenticated pushes.
          echo "registry=000000000000.dkr.ecr.us-east-1.aws-localstack-server:4566/yasna-localstack-repo" >> $GITHUB_OUTPUT
        
      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ECR_REGISTRY="${{ steps.ecr.outputs.registry }}"
          docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" .
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "$AWS_REGION"

      - name: Rollout new image
        run: |
          # --record is deprecated and removed in kubectl v1.28+
          kubectl -n default set image "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=$IMAGE_URI"
          kubectl -n default rollout status "deployment/$K8S_DEPLOYMENT" --timeout=5m
