name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_ENDPOINT_URL: ${{ secrets.LOCALSTACK_ENDPOINT }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: feed-service
  K8S_DEPLOYMENT: feed-service
  K8S_CONTAINER: feed-service

jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to LocalStack ECR
        id: ecr
        run: |
          # Strip http:// or https:// to get the raw domain and port for Docker
          REGISTRY_HOST=$(echo "${{ env.AWS_ENDPOINT_URL }}" | sed -E 's|^https?://||; s|/.*$||')
          
          # Bypass the AWS CLI entirely. LocalStack accepts dummy credentials.
          echo "localstack" | docker login --username "localstack" --password-stdin "$REGISTRY_HOST"
          
          # Output the registry path with LocalStack's default account ID (000000000000)
          echo "registry=$REGISTRY_HOST/000000000000" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "IMAGE_URI=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: kubeconfig
        run: aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Rollout new image
        run: |
          kubectl -n default set image "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=$IMAGE_URI" --record
          kubectl -n default rollout status "deployment/$K8S_DEPLOYMENT" --timeout=5m
