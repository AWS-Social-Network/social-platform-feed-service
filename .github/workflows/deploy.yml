name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  AWS_ENDPOINT_URL: ${{ secrets.LOCALSTACK_ENDPOINT }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/feed-service"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" .
          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "$AWS_REGION"
          kubectl config set-cluster "$(kubectl config current-context)" \
            --insecure-skip-tls-verify=true

      - name: Adopt namespace for Helm
        run: |
          kubectl create namespace social-app --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace social-app app.kubernetes.io/managed-by=Helm --overwrite
          kubectl annotate namespace social-app \
            meta.helm.sh/release-name=social-app \
            meta.helm.sh/release-namespace=social-app \
            --overwrite
          kubectl label secret ghcr-pull-secret -n social-app app.kubernetes.io/managed-by=Helm --overwrite
          kubectl annotate secret ghcr-pull-secret -n social-app \
            meta.helm.sh/release-name=social-app \
            meta.helm.sh/release-namespace=social-app \
            --overwrite

      - name: Deploy via Helm
        run: |
          helm upgrade --install social-app helm/social-app \
            --namespace social-app \
            --set imagePullSecret.password="${{ secrets.GHCR_PAT }}" \
            --set "services.feed-service.image=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            --wait \
            --timeout 5m
