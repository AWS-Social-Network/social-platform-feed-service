name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  K8S_DEPLOYMENT: feed-service
  K8S_CONTAINER: feed-service
  # ghcr.io/your-org/feed-service
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/feed-service
jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
      packages: write   # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" .
          # Also tag as latest for convenience
          docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:latest"
          echo "IMAGE_URI=${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "$AWS_REGION"

      - name: Rollout new image
        run: |
          kubectl -n default set image "deployment/$K8S_DEPLOYMENT" "$K8S_CONTAINER=$IMAGE_URI"
          kubectl -n default rollout status "deployment/$K8S_DEPLOYMENT" --timeout=5m
