apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-service
  namespace: default
  labels:
    app: feed-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feed-service
  template:
    metadata:
      labels:
        app: feed-service
    spec:
      serviceAccountName: feed-service
      containers:
        - name: feed-service
          image: ghcr.io/aws-social-network/feed-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: SQS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: feed-service-secrets
                  key: sqs-queue-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: feed-service-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: feed-service-secrets
                  key: secret-key
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
