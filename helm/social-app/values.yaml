###############################################################
# helm/social-app/values.yaml
# Default values — override per environment via values-<env>.yaml
# or with --set flags in CI.
###############################################################

namespace: social-app

imagePullSecret:
  name: ghcr-pull-secret
  registry: ghcr.io
  username: AWS-Social-Network
  # password: ""   ← never commit; pass via --set imagePullSecret.password=$GHCR_PAT

services:
  - name: auth-service
    image: hashicorp/http-echo:0.2.3   # replace with your real image
    args: ["-text=auth-service"]
    replicas: 2
    containerPort: 80
    nodePort: 30080

  - name: post-service
    image: hashicorp/http-echo:0.2.3
    args: ["-text=post-service"]
    replicas: 2
    containerPort: 80
    nodePort: 30081

  - name: feed-service
    image: hashicorp/http-echo:0.2.3
    args: ["-text=feed-service"]
    replicas: 2
    containerPort: 80
    nodePort: 30082
