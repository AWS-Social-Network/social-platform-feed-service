###############################################################
# helm/social-app/values.yaml
# Default values — override per environment via values-<env>.yaml
# or with --set flags in CI.
###############################################################

namespace: social-app

imagePullSecret:
  name: ghcr-pull-secret
  registry: ghcr.io
  username: AWS-Social-Network
  # password: ""   ← never commit; pass via --set imagePullSecret.password=$GHCR_PAT

# values.yaml
services:
  auth-service:
    image: hashicorp/http-echo:0.2.3
    replicas: 2
    containerPort: 80
    nodePort: 30080

  feed-service:
    image: hashicorp/http-echo:0.2.3
    replicas: 2
    containerPort: 80
    nodePort: 30082

  - name: feed-service
    image: hashicorp/http-echo:0.2.3
    replicas: 2
    containerPort: 80
    nodePort: 30082
