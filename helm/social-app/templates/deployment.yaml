###############################################################
# templates/deployment.yaml
# Equivalent to the former kubernetes_deployment.services[*]
###############################################################
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      imagePullSecrets:
        - name: {{ $.Values.imagePullSecret.name }}
      containers:
        - name: {{ $name }}
          image: {{ $svc.image }}
          args: {{ $svc.args | toJson }}
          ports:
            - containerPort: {{ $svc.containerPort }}
{{- end }}