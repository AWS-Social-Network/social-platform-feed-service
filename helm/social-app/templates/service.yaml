###############################################################
# templates/service.yaml
# Equivalent to the former kubernetes_service.services[*]
###############################################################
{{- range .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}-svc
  namespace: {{ $.Values.namespace }}
spec:
  type: NodePort
  selector:
    app: {{ .name }}
  ports:
    - port: {{ .containerPort }}
      targetPort: {{ .containerPort }}
      nodePort: {{ .nodePort }}
{{- end }}